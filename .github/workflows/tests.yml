# בדיקות — רצות על כל PR ועל כל דחיפה ל-main.
#
# עד עכשיו הבדיקות רצו רק כחלק מריצת הראדאר היומית, כלומר אחרי שהקוד כבר
# ב-main. מעכשיו PR מקבל חיווי אמיתי לפני המיזוג.
#
# שתי משימות בכוונה, ולא אחת:
#
# הסוכן והראדאר חסרי תלויות חיצוניות ורצים על node:test בלבד — להתקין עבורם
# חבילות זה רק זמן ונקודת כשל ברשת. לכן `core` רץ בלי התקנה, מהר, ותמיד.
#
# מערכת ה-AI, לעומתם, דורשת sqlite3/express/exceljs. כשהיא נוספה ל-`npm test`
# בלי שהותקנו התלויות, ה-CI נפל על "Cannot find module 'sqlite3'" בכל דחיפה
# ל-main — חמש פעמים ברצף — בזמן שמקומית הכול היה ירוק כי node_modules קיים.
# כאן היא מקבלת משימה משלה עם npm ci, וכשל בהתקנה לא מסתיר את מצב הליבה.
name: tests

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: סוכן הרשת וראדאר המכרזים
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # הקוד משתמש ב-fetch המובנה וב-node:test, ולכן נדרש Node 18 ומעלה.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: בדיקות ליבה — בלי תלויות חיצוניות
        run: npm run test:core

  ai:
    name: מערכת ההתראות AI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: התקנת תלויות
        run: npm ci

      - name: בדיקות AI — מבנה, כללי החלטה, ייצוא ו-API הדשבורד
        run: npm run test:ai

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # הבדיקות עוטפות את ה-API ב-@patch("anthropic.Anthropic"), ולכן החבילה
      # חייבת להיות ניתנת לייבוא — גם בלי מפתח וגם בלי שום קריאה החוצה.
      - name: התקנת תלות פייתון
        run: pip install -r requirements.txt

      - name: בדיקות פייתון — מנהל ההתראות ומנתח ה-AI
        run: npm run test:py
