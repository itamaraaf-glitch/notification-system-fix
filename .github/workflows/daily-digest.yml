# הרצה יומית בענן: קוראת את נתוני ה-CRM מענן הסנכרון (Firebase) ופותחת
# Issue עם תקציר הבוקר — GitHub שולח אותו אוטומטית למייל של בעל המאגר.
# פועלת רק אם הוגדרו הסודות FIREBASE_DB_URL ו-SYNC_CODE (Settings → Secrets).
name: daily-digest

on:
  schedule:
    # כל חצי שעה בין 07:00–18:30 שעון ישראל (קיץ), ראשון–שישי:
    # בבוקר נשלח תקציר (Issue למייל + דחיפה לטלפון), ובשאר הריצות — תזכורות פגישה לטלפון
    - cron: '0,30 4-15 * * 0-5'
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install web-push
        run: npm install web-push@3 --no-save --silent
      - name: build and send digest
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          SYNC_CODE: ${{ secrets.SYNC_CODE }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          FORCE_DIGEST: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: node .github/scripts/daily-digest.js
