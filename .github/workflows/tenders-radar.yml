# ראדאר מכרזים: סורק אחת ליום מקורות מכרזים ציבוריים בישראל, מסנן את הרלוונטיים
# לתקשורת / ציוד תקשורת / אבטחת מידע / IT, שומר את התוצאות במאגר ופותח Issue
# עם המכרזים החדשים — GitHub שולח אותו אוטומטית למייל של בעל המאגר.
name: tenders-radar

on:
  schedule:
    # 06:10 שעון ישראל (קיץ), ראשון–חמישי — לפני תחילת יום העבודה
    - cron: '10 3 * * 0-4'
  workflow_dispatch:
    inputs:
      source:
        description: 'סריקת מקור בודד בלבד (מזהה מתוך tenders/config/sources.json). ריק = כל המקורות'
        required: false
        default: ''
      debug:
        description: 'מצב אבחון: מזהה מקור להדפסת הקישורים, ההקשר והתאריכים שנמצאו בדף. לא שומר ולא מדווח.'
        required: false
        default: ''
      probe:
        description: 'מדידת נגישות: "all" לכל המקורות, או שם קטגוריה / מזהה מקור. בודק מי נענה ומי חוסם, בלי לשמור ובלי לדווח.'
        required: false
        default: ''
      audit:
        description: 'ביקורת משפך: שם קטגוריה או מזהה מקור. מריץ את הסריקה האמיתית ומדווח כמה קישורים נפלו בכל שער. לא שומר ולא מדווח.'
        required: false
        default: ''
      authorities:
        description: 'data.gov.il: הקלד domains כדי לחלץ דומיינים רשמיים של רשויות מכתובות דוא"ל, או any לסקירת מערכי נתונים. לא פוגע באתרי הרשויות.'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: tenders-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: בדיקות ליבת הראדאר
        run: npm test

      # מצב אבחון: מריץ רק את ההדפסה ומדלג על שמירה ודיווח
      - name: אבחון מקור
        if: inputs.debug != ''
        run: node .github/scripts/tenders-fetch.js --debug="${{ inputs.debug }}" | tee -a "$GITHUB_STEP_SUMMARY"

      # מדידת נגישות: בקשה אחת לכל מקור, בלי סריקה, בלי שמירה ובלי דיווח
      - name: מפתח הרשויות המקומיות
        if: inputs.authorities != ''
        run: node .github/scripts/tenders-fetch.js --authorities ${{ inputs.authorities == 'domains' && '--domains' || '' }} | tee -a "$GITHUB_STEP_SUMMARY"

      - name: ביקורת משפך
        if: inputs.audit != ''
        run: node .github/scripts/tenders-fetch.js --audit="${{ inputs.audit }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: מדידת נגישות מקורות
        if: inputs.probe != ''
        run: |
          if [ "${{ inputs.probe }}" = "all" ]; then
            node .github/scripts/tenders-fetch.js --probe | tee -a "$GITHUB_STEP_SUMMARY"
          else
            node .github/scripts/tenders-fetch.js --probe="${{ inputs.probe }}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: סריקת מקורות המכרזים
        if: inputs.debug == '' && inputs.probe == '' && inputs.audit == '' && inputs.authorities == ''
        env:
          TENDERS_ONLY_SOURCE: ${{ inputs.source }}
        run: |
          if [ -n "$TENDERS_ONLY_SOURCE" ]; then
            node .github/scripts/tenders-fetch.js --source="$TENDERS_ONLY_SOURCE"
          else
            node .github/scripts/tenders-fetch.js
          fi

      # סקירת AI ל"כמעט התאמות" — רצה רק אם הוגדר סוד ANTHROPIC_API_KEY.
      # בלעדיו הצעדים מדלגים את עצמם והראדאר עובד בדיוק כמו קודם.
      #
      # התנאי הקודם היה env.ANTHROPIC_API_KEY, כשהמשתנה מוגדר ב-env של אותו צעד
      # עצמו — וה-env של צעד אינו זמין ל-if שלו. התנאי היה false תמיד, ולכן גם
      # אחרי הוספת הסוד הצעד היה ממשיך לדלג על עצמו. גם secrets אינו זמין ב-if
      # (GitHub דוחה את קובץ ה-workflow), ולכן צעד נפרד קורא את הסוד ומפרסם
      # פלט שהצעדים הבאים נתלים בו.
      - name: מצב סקירת ה-AI
        id: ai
        if: inputs.debug == '' && inputs.probe == '' && inputs.audit == '' && inputs.authorities == ''
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "🤖 הסוד ANTHROPIC_API_KEY מוגדר — סקירת ה-AI תרוץ" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ הסוד ANTHROPIC_API_KEY אינו מוגדר — סקירת ה-AI מדולגת, והראדאר עובד כרגיל." >> "$GITHUB_STEP_SUMMARY"
            echo "להפעלה: Settings → Secrets and variables → Actions → New repository secret, בשם ANTHROPIC_API_KEY." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: התקנת תלויות לסקירת AI
        if: steps.ai.outputs.enabled == 'true'
        run: npm ci --omit=dev

      - name: סקירת AI למכרזים שכמעט נכנסו
        if: steps.ai.outputs.enabled == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node .github/scripts/tenders-ai.js

      - name: סיכום הריצה
        if: inputs.debug == '' && inputs.probe == '' && inputs.audit == '' && inputs.authorities == ''
        run: node .github/scripts/tenders-report.js --summary >> "$GITHUB_STEP_SUMMARY"

      - name: שמירת התוצאות במאגר
        if: inputs.debug == '' && inputs.probe == '' && inputs.audit == '' && inputs.authorities == ''
        run: |
          if git diff --quiet -- tenders/data; then
            echo "אין שינוי בנתוני המכרזים — אין מה לשמור"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tenders/data
          git commit -m "ראדאר מכרזים: עדכון נתונים אוטומטי ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "הדחיפה נכשלה — ניסיון $attempt"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep $((2 ** attempt))
          done
          echo "::error::דחיפת נתוני המכרזים נכשלה"
          exit 1

      - name: פתיחת Issue עם המכרזים החדשים
        if: inputs.debug == '' && inputs.probe == '' && inputs.audit == '' && inputs.authorities == ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: node .github/scripts/tenders-report.js --issue
