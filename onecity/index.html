<body>
<title>One City SD-WAN</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: single centered access card over a slow network grid */
:root{--bg:#06080e;--card:#0d1120;--line:#2a3260;--fg:#eef1fa;--mute:#8d95b8;--red:#ff2a4f;--mag:#ff3fbf;--mint:#5df2c6;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Assistant','Segoe UI',Arial,sans-serif;display:grid;place-items:center;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;box-sizing:border-box;
  background-image:linear-gradient(rgba(154,168,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(154,168,255,.05) 1px,transparent 1px);background-size:40px 40px}
.card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px 30px;display:flex;flex-direction:column;gap:18px;box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 60px rgba(255,42,79,.08)}
.eb{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;color:var(--mint);direction:ltr;text-align:right}
h1{margin:0;font-family:'Secular One',sans-serif;font-weight:400;font-size:34px;line-height:1.1}
h1 span{background:linear-gradient(270deg,var(--red),var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0;color:var(--mute);font-size:16px;line-height:1.5}
form{display:flex;flex-direction:column;gap:12px}
label{font-size:14px;color:var(--mute)}
input{font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:.3em;text-align:center;text-transform:uppercase;direction:ltr;background:#06080e;color:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 12px;outline:none;width:100%;box-sizing:border-box}
input:focus{border-color:var(--mag);box-shadow:0 0 0 3px rgba(255,63,191,.2)}
button{font-family:inherit;font-size:17px;font-weight:600;color:#fff;border:0;border-radius:12px;padding:13px;cursor:pointer;background:linear-gradient(270deg,var(--red),var(--mag))}
button:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
button[disabled]{opacity:.6;cursor:wait}
.err{min-height:22px;font-size:14px;color:var(--red)}
.card.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(8px)}50%{transform:translateX(-8px)}75%{transform:translateX(4px)}}
</style>
<div class="card" id="card">
  <div class="eb">HOT BUSINESS · SECURE ACCESS</div>
  <h1><span>One City</span> · SD-WAN</h1>
  <p>המצגת מוצפנת. הזן את קוד הכניסה שקיבלת.</p>
  <form id="f" autocomplete="off">
    <label for="code">קוד כניסה</label>
    <input id="code" name="code" maxlength="16" spellcheck="false" autocapitalize="characters" required>
    <button id="go" type="submit">כניסה למצגת</button>
    <div class="err" id="err" aria-live="polite"></div>
  </form>
</div>
